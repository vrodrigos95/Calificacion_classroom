[project]
name = "calificacion-classroom"
version = "0.1.0"
description = "Revisor de tareas manuscritas de matemáticas entregadas en Google Classroom"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    "cryptography>=43",
    "itsdangerous>=2.2",
    "pymupdf>=1.24",
    "pillow>=11",
    "pillow-heif>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
